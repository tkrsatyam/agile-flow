services:
  postgres:
    image: postgres:16-alpine
    container_name: agileflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agileflow
      POSTGRES_USER: agileflow
      POSTGRES_PASSWORD: agileflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agileflow -d agileflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
